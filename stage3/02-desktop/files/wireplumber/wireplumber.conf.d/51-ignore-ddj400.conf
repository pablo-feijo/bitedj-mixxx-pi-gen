monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.*DDJ-400*"
      },
      {
        node.name = "~alsa_output.*DDJ-400*"
      },
      {
        device.name = "~alsa_card.*DDJ-400*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
        node.disabled = true
      }
    }
  }
]
