name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      BITEDJ_RELEASE_BUILD: '1'
      CONTAINER_NAME: bitedj-ci-image
    steps:
      - uses: actions/checkout@v4
        with:
          path: image-source
      - name: Check out the matching application release
        uses: actions/checkout@v4
        with:
          repository: pablo-feijo/custom-bitedj
          ref: codex/v0.0.8
          path: application
      - name: Select release branch and image source
        run: |
          git -C application checkout -B codex/v0.0.8
          rmdir application/mixxx-pi-gen
          mv image-source application/mixxx-pi-gen
          git -C application rev-parse HEAD
          git -C application/mixxx-pi-gen rev-parse HEAD
      - name: Validate the image recipe
        working-directory: application/mixxx-pi-gen
        run: |
          python3 scripts/test/check-git-storage.py
          python3 -m unittest discover -s tests/repository -p 'test_*.py'
      - name: Build the matching ARM64 application
        working-directory: application
        run: ./scripts/build/docker-build.sh --platform linux/arm64
      - name: Build and verify the versioned OS image
        working-directory: application
        run: |
          python3 - <<'PYVERSION'
          import json, pathlib, re
          version = json.loads(pathlib.Path('dist-linux/build-provenance.json').read_text())['version']
          config = pathlib.Path('mixxx-pi-gen/config')
          config.write_text(re.sub(r'^IMG_NAME=.*$', f'IMG_NAME="bitedj-pi-v{version}"', config.read_text(), count=1, flags=re.M))
          PYVERSION
          ./scripts/build/generate-pi-image.sh
          python3 - <<'PY'
          import pathlib, zipfile
          images = list(pathlib.Path('mixxx-pi-gen/deploy').glob('*.zip'))
          assert images, 'No OS image was produced'
          for image in images:
              with zipfile.ZipFile(image) as archive:
                  assert archive.testzip() is None, f'Corrupt archive: {image}'
          PY
      - name: Upload image and application provenance
        uses: actions/upload-artifact@v4
        with:
          name: bitedj-pi-${{ github.sha }}
          if-no-files-found: error
          path: |
            application/mixxx-pi-gen/deploy/*.zip
            application/mixxx-pi-gen/deploy/*.info
            application/mixxx-pi-gen/deploy/*.version
            application/mixxx-pi-gen/deploy/*.tag
            application/dist-linux/build-provenance.json
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-build-logs
          path: application/mixxx-pi-gen/deploy/*.log
